<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectGuard - Login & Sign Up</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=password-field-4">
    <style>
        /* Auth specific overrides/additions if needed, though most will be in style.css */
        body {
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
    </style>
</head>
<body data-portal="mentor">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="ph ph-graduation-cap"></i>
                    <span>ProjectGuard</span>
                </div>
                <h2 id="auth-title">Welcome Back</h2>
                <p id="auth-subtitle">Please Enter your details to continue</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-roll">Mentor Name</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="login-roll" placeholder="Enter Mentor Name" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-pass">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" data-password-input required>
                        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-password-toggle="login-pass"><i class="ph ph-eye" aria-hidden="true"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">
                    <span>Login</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
                <p class="auth-switch">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </form>

            <!-- Signup Form (Hidden by default) -->
            <form id="signup-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="signup-id">Mentor Name</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="signup-id" placeholder="Enter Mentor Name" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-pass">Create Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signup-pass" placeholder="••••••••" autocomplete="new-password" data-password-input required>
                        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-password-toggle="signup-pass"><i class="ph ph-eye" aria-hidden="true"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-pass">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signup-confirm-pass" placeholder="••••••••" autocomplete="off" data-lpignore="true" data-password-input required>
                        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-password-toggle="signup-confirm-pass"><i class="ph ph-eye" aria-hidden="true"></i></button>
                    </div>
                </div>
                <div id="clerk-captcha"></div>
                <button type="submit" class="btn btn-primary auth-btn">
                    <span>Create Account</span>
                    <i class="ph ph-user-plus"></i>
                </button>
                <p class="auth-switch">Already have an account? <a href="#" id="show-login">Login</a></p>
            </form>
        </div>
    </div>

    <script src="deployment-config.js"></script>
    <script src="clerk-config.js?v=clerk-token-2"></script>
    <script src="auth.js?v=clerk-auth-8"></script>
</body>
</html>
