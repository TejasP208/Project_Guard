<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enrollment administration · ProjectGuard</title><link rel="stylesheet" href="style.css"><style>main{max-width:1000px;margin:40px auto;padding:24px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}input,button{padding:10px;margin:6px}#issued{overflow-wrap:anywhere}#message{color:#b42318}</style></head>
<body data-clerk-ui="true"><main><h1>Enrollment administration</h1><p>Issue a student code and send it privately.</p><div id="signin"></div><button id="signout" hidden>Sign out</button><p id="message" role="status" aria-live="polite"></p><div id="admin" hidden><section><h2>Create enrollment code</h2><form id="issue"><label>Roll number <input name="roll_no" required maxlength="64"></label><label>Year <input name="year" required maxlength="64"></label><label>Valid for (hours) <input name="expires_hours" type="number" min="1" max="8760" value="168" required></label><button type="submit">Generate code</button></form><div id="issued" hidden><p>This code is shown once. Copy it before leaving this page.</p><code id="code"></code><button id="copy">Copy code</button></div></section><section><h2>Recent enrollments</h2><button id="refresh">Refresh</button><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Roll number</th><th>Year</th><th>Expires</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><p>Showing the latest 200 enrollments.</p></section></div></main><script src="deployment-config.js"></script><script src="clerk-config.js?v=admin-ui-3"></script><script src="admin.js?v=1"></script></body></html>
